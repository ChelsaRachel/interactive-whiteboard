[project]
name = "papan-tulis-digital-backend"
version = "0.1.0"
description = "Backend papan tulis digital: pengenalan rumus tulisan tangan (ONNX) dan proxy asisten AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "pillow>=10.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
